<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер расходов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1>Мои расходы</h1>
            <span id="monthLabel" class="app__month"></span>
        </header>

        <section class="form">
            <input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" class="form__amount">
            <select id="categorySelect" class="form__select"></select>
            <button id="addBtn" class="form__btn">Добавить</button>
        </section>

        <section class="summary">
            <div class="summary__total">
                <span class="summary__label">Потрачено за месяц</span>
                <span id="totalAmount" class="summary__value">0 ₽</span>
            </div>
            <button id="resetBtn" class="summary__reset">Сбросить месяц</button>
        </section>

        <section class="chart">
            <canvas id="expenseChart" aria-label="Диаграмма расходов по категориям"></canvas>
            <p id="emptyHint" class="chart__hint">Пока нет расходов. Добавьте первую трату выше.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
